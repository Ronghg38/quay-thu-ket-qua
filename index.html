<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quay Thử Tham Khảo Xổ Số Miền Nam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* Thanh tiêu đề xanh phía trên */
    .app-header {
      background-color: #0b4f9c;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: 600;
      gap: 14px;
    }

    .app-header .back-arrow {
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    /* Thanh chọn ngày và nút bấm */
    .control-bar {
      display: flex;
      padding: 10px 12px;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #eeeeee;
    }

    .day-select {
      flex: 1;
      padding: 9px 10px;
      font-size: 15px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      background-color: #ffffff;
      color: #222222;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-spin {
      min-width: 115px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background-color: #e66000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.15s;
    }

    .btn-spin.spinning {
      background-color: #c92a1d;
    }

    /* Tiêu đề bảng */
    .title-section {
      text-align: center;
      padding: 6px 10px 10px;
    }

    .title-section h1 {
      color: #c92a1d;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .title-section p {
      color: #757575;
      font-size: 13px;
    }

    /* Bảng kết quả */
    .result-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .result-table th,
    .result-table td {
      text-align: center;
      vertical-align: middle;
    }

    .result-table thead th {
      padding: 6px 4px 10px;
      font-size: 15px;
      font-weight: 700;
      color: #212121;
      border-bottom: 1px solid #e0e0e0;
    }

    .col-prize {
      width: 46px;
      font-size: 14px !important;
      font-weight: 500 !important;
      color: #333333;
    }

    .prize-group-row {
      border-bottom: 1px solid #e0e0e0;
    }

    .sub-row td {
      padding: 5.5px 2px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #111111;
      transition: background-color 0.1s;
    }

    /* Đổi màu đỏ cho Giải 8 và Giải ĐB */
    .sub-row.red-text td.num-cell {
      color: #d32f2f;
    }

    .col-prize.red-label {
      color: #d32f2f;
      font-weight: 700 !important;
    }

    /* Hàng đang quay tô nền vàng */
    .sub-row.active-spin td.num-cell {
      background-color: #fff59d;
    }

    /* Chấm chờ khi chưa quay */
    .dots {
      letter-spacing: 2px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <span class="back-arrow">&#8592;</span>
    <span>Quay thử</span>
  </header>

  <div class="control-bar">
    <select id="daySelect" class="day-select">
      <option value="T2">Thứ 2 (TP.HCM, Đồng Tháp, Cà Mau)</option>
      <option value="T3">Thứ 3 (Bến Tre, Vũng Tàu, Bạc Liêu)</option>
      <option value="T4">Thứ 4 (Đồng Nai, Cần Thơ, Sóc Trăng)</option>
      <option value="T5" selected>Thứ 5 (Tây Ninh, An Giang, Bình Thuận)</option>
      <option value="T6">Thứ 6 (Vĩnh Long, Bình Dương, Trà Vinh)</option>
      <option value="T7">Thứ 7 (TP.HCM, Long An, Bình Phước, Hậu Giang)</option>
      <option value="CN">Chủ Nhật (Tiền Giang, Kiên Giang, Đà Lạt)</option>
    </select>
    <button id="spinBtn" class="btn-spin">QUAY THỬ</button>
  </div>

  <div class="title-section">
    <h1>Tham khảo Xổ Số Miền Nam</h1>
    <p>Thông tin chỉ mang tính tham khảo</p>
  </div>

  <table class="result-table" id="resultTable">
    <thead>
      <tr id="stationHeaderRow"></tr>
    </thead>
    <tbody id="prizeBody"></tbody>
  </table>
</div>

<script>
  // Dữ liệu các đài theo ngày trong tuần
  const STATIONS_BY_DAY = {
    T2: ["TP.HCM", "Đồng Tháp", "Cà Mau"],
    T3: ["Bến Tre", "Vũng Tàu", "Bạc Liêu"],
    T4: ["Đồng Nai", "Cần Thơ", "Sóc Trăng"],
    T5: ["Tây Ninh", "An Giang", "Bình Thuận"],
    T6: ["Vĩnh Long", "Bình Dương", "Trà Vinh"],
    T7: ["TP.HCM", "Long An", "Bình Phước", "Hậu Giang"],
    CN: ["Tiền Giang", "Kiên Giang", "Đà Lạt"]
  };

  // Cấu trúc 18 lô giải thưởng Xổ Số Miền Nam
  const PRIZE_STRUCTURE = [
    { label: "8", count: 1, digits: 2, isRed: true },
    { label: "7", count: 1, digits: 3, isRed: false },
    { label: "6", count: 3, digits: 4, isRed: false },
    { label: "5", count: 1, digits: 4, isRed: false },
    { label: "4", count: 7, digits: 5, isRed: false },
    { label: "3", count: 2, digits: 5, isRed: false },
    { label: "2", count: 1, digits: 5, isRed: false },
    { label: "1", count: 1, digits: 5, isRed: false },
    { label: "ĐB", count: 1, digits: 6, isRed: true }
  ];

  const daySelect = document.getElementById("daySelect");
  const spinBtn = document.getElementById("spinBtn");
  const stationHeaderRow = document.getElementById("stationHeaderRow");
  const prizeBody = document.getElementById("prizeBody");

  let isSpinning = false;
  let spinTimeouts = [];
  let spinIntervals = [];
  let audioCtx = null;
  let musicInterval = null;

  // Khởi tạo nhạc nền 8-bit giống trong video bằng Web Audio API
  function playNote(freq, duration, startTime, type = "square", gainVal = 0.06) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);

    gain.gain.setValueAtTime(gainVal, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function startBackgroundMusic() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const progression = [
      [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25], // C5 - E5 - G5 - C6
      [440.00, 523.25, 659.25, 880.00, 659.25, 523.25],  // A4 - C5 - E5 - A5
      [349.23, 440.00, 523.25, 698.46, 523.25, 440.00],  // F4 - A4 - C5 - F5
      [392.00, 493.88, 587.33, 783.99, 587.33, 493.88]   // G4 - B4 - D5 - G5
    ];

    let barIndex = 0;
    const stepTime = 0.14;

    function scheduleBar() {
      if (!isSpinning) return;
      const notes = progression[barIndex % progression.length];
      const now = audioCtx.currentTime;
      notes.forEach((freq, idx) => {
        playNote(freq, stepTime, now + idx * stepTime);
      });
      barIndex++;
    }

    scheduleBar();
    musicInterval = setInterval(scheduleBar, stepTime * 6 * 1000);
  }

  function stopBackgroundMusic(playFanfare = false) {
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    if (playFanfare && audioCtx) {
      const now = audioCtx.currentTime;
      const fanfare = [523.25, 659.25, 783.99, 1046.50];
      fanfare.forEach((f, i) => {
        playNote(f, 0.12, now + i * 0.08, "square", 0.07);
      });
      // Hợp âm kết thúc
      [523.25, 659.25, 783.99, 1046.50].forEach(f => {
        playNote(f, 0.5, now + 0.35, "triangle", 0.05);
      });
    }
  }

  // Tạo chuỗi số ngẫu nhiên theo độ dài
  function randomDigits(length) {
    let result = "";
    for (let i = 0; i < length; i++) {
      result += Math.floor(Math.random() * 10);
    }
    return result;
  }

  // Vẽ bảng theo ngày được chọn
  function renderTable() {
    const stations = STATIONS_BY_DAY[daySelect.value];
    
    // Vẽ tiêu đề cột
    stationHeaderRow.innerHTML = `<th class="col-prize">Giải</th>` +
      stations.map(st => `<th>${st}</th>`).join("");

    // Vẽ các hàng giải thưởng
    prizeBody.innerHTML = "";
    let stepIndex = 0;

    PRIZE_STRUCTURE.forEach(prize => {
      for (let r = 0; r < prize.count; r++) {
        const tr = document.createElement("tr");
        tr.className = "sub-row" + (prize.isRed ? " red-text" : "");
        if (r === prize.count - 1) {
          tr.classList.add("prize-group-row");
        }
        tr.dataset.step = stepIndex;
        tr.dataset.digits = prize.digits;

        // Cột tên giải (rowspan cho các giải có nhiều hàng)
        if (r === 0) {
          const tdLabel = document.createElement("td");
          tdLabel.className = "col-prize" + (prize.isRed ? " red-label" : "");
          tdLabel.rowSpan = prize.count;
          tdLabel.textContent = prize.label;
          tr.appendChild(tdLabel);
        }

        // Cột số của từng đài
        for (let c = 0; c < stations.length; c++) {
          const tdNum = document.createElement("td");
          tdNum.className = "num-cell";
          tdNum.innerHTML = `<span class="dots">&bull;&bull;&bull;</span>`;
          tr.appendChild(tdNum);
        }

        prizeBody.appendChild(tr);
        stepIndex++;
      }
    });
  }

  // Dừng toàn bộ tiến trình đang quay
  function clearSpinTimers() {
    spinTimeouts.forEach(t => clearTimeout(t));
    spinIntervals.forEach(i => clearInterval(i));
    spinTimeouts = [];
    spinIntervals = [];
    document.querySelectorAll(".sub-row.active-spin").forEach(row => {
      row.classList.remove("active-spin");
    });
  }

  // Bắt đầu quay thử từng hàng từ Giải 8 đến Giải ĐB
  function startSpin() {
    clearSpinTimers();
    renderTable();

    isSpinning = true;
    spinBtn.textContent = "DỪNG";
    spinBtn.classList.add("spinning");
    startBackgroundMusic();

    const rows = Array.from(document.querySelectorAll("#prizeBody .sub-row"));
    const durationPerRow = 1800; // 1.8 giây mỗi hàng

    rows.forEach((row, index) => {
      const startDelay = index * durationPerRow;
      const digits = parseInt(row.dataset.digits, 10);
      const cells = row.querySelectorAll(".num-cell");

      const startTimer = setTimeout(() => {
        row.classList.add("active-spin");

        // Hiệu ứng nhảy số liên tục
        const rolling = setInterval(() => {
          cells.forEach(cell => {
            cell.textContent = randomDigits(digits);
          });
        }, 70);
        spinIntervals.push(rolling);

        // Chốt số của hàng hiện tại và chuyển sang hàng tiếp theo
        const stopRowTimer = setTimeout(() => {
          clearInterval(rolling);
          cells.forEach(cell => {
            cell.textContent = randomDigits(digits);
          });
          row.classList.remove("active-spin");

          // Nếu là hàng Giải ĐB cuối cùng
          if (index === rows.length - 1) {
            isSpinning = false;
            spinBtn.textContent = "QUAY THỬ";
            spinBtn.classList.remove("spinning");
            stopBackgroundMusic(true);
          }
        }, durationPerRow - 40);

        spinTimeouts.push(stopRowTimer);
      }, startDelay);

      spinTimeouts.push(startTimer);
    });
  }

  // Nút DỪNG: Hiển thị ngay toàn bộ kết quả còn lại
  function stopSpinImmediately() {
    clearSpinTimers();
    stopBackgroundMusic(false);

    const rows = Array.from(document.querySelectorAll("#prizeBody .sub-row"));
    rows.forEach(row => {
      const digits = parseInt(row.dataset.digits, 10);
      const cells = row.querySelectorAll(".num-cell");
      cells.forEach(cell => {
        if (cell.querySelector(".dots")) {
          cell.textContent = randomDigits(digits);
        }
      });
    });

    isSpinning = false;
    spinBtn.textContent = "QUAY THỬ";
    spinBtn.classList.remove("spinning");
  }

  spinBtn.addEventListener("click", () => {
    if (isSpinning) {
      stopSpinImmediately();
    } else {
      startSpin();
    }
  });

  daySelect.addEventListener("change", () => {
    if (isSpinning) {
      clearSpinTimers();
      stopBackgroundMusic(false);
      isSpinning = false;
      spinBtn.textContent = "QUAY THỬ";
      spinBtn.classList.remove("spinning");
    }
    renderTable();
  });

  // Khởi tạo bảng lần đầu và tự động quay thử
  renderTable();
</script>

</body>
</html>
