<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quay Thử XSKT Miền Nam</title>
    <!-- Nhúng thư viện ghi hình MediaStreamRecorder/RecordRTC để hỗ trợ lưu video ổn định -->
    <script src="https://www.jsdelivr.com/package/npm/recordrtc"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 5px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 2px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header {
            background-color: #ffcc00;
            color: #cc0000;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px 2px;
            font-size: 13px;
        }
        th {
            background-color: #fff;
            color: #cc0000;
            font-size: 14px;
            text-transform: uppercase;
        }
        .prize-label {
            width: 55px;
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }
        .number-cell {
            font-weight: bold;
            letter-spacing: 0.5px;
            height: 28px;
        }
        .red-text {
            color: #cc0000;
            font-size: 18px;
            font-weight: bold;
        }
        .blue-text {
            color: #0000cc;
            font-size: 15px;
            font-weight: bold;
        }
        .black-text {
            color: #000;
            font-size: 14px;
        }
        .controls {
            text-align: center;
            padding: 10px;
            background: #e9e9e9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .controls button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }
        .controls button:hover {
            background-color: #990000;
        }
        .controls button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status-text {
            font-size: 12px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    <div class="header" id="header-title">
        QUAY THỬ XSKT MIỀN NAM
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 55px;" id="col-label"></th>
                <th id="dai-0">ĐÀI 1</th>
                <th id="dai-1">ĐÀI 2</th>
                <th id="dai-2" style="display:none;">ĐÀI 3</th>
            </tr>
        </thead>
        <tbody id="lottery-body">
        </tbody>
    </table>

    <div class="controls">
        <button id="start-btn" onclick="startQuayThu()">BẮT ĐẦU QUAY THỬ & LƯU VIDEO</button>
        <span id="status-text">Hệ thống sẵn sàng. Thời gian quay khoảng 1 phút 30 giây.</span>
    </div>
</div>

<script>
    // Lịch các đài quay miền Nam theo thứ trong tuần (0: Chủ Nhật -> 6: Thứ Bảy)
    const schedule = {
        0: ["KẾT SÁNG", "ĐÀ LAT", "KIÊN GIANG", "TIỀN GIANG"], // Chủ Nhật (3 đài)
        1: ["TP. HỒ CHÍ MINH", "ĐỒNG THÁP", "CÀ MAU"],          // Thứ Hai
        2: ["BẾN TRE", "VŨNG TÀU", "BẠC LIÊU"],                // Thứ Ba
        3: ["ĐỒNG NAI", "CẦN THƠ", "SÓC TRĂNG"],               // Thứ Tư
        4: ["TÂY NINH", "AN GIANG", "BÌNH THUẬN"],             // Thứ Năm
        5: ["VĨNH LONG", "BÌNH DƯƠNG", "TRÀ VINH"],            // Thứ Sáu
        6: ["TP. HỒ CHÍ MINH", "LONG AN", "BÌNH PHƯỚC", "HẬU GIANG"] // Thứ Bảy (4 đài)
    };

    const prizes = [
        { name: "8", digits: 2, class: "red-text" },
        { name: "7", digits: 3, class: "blue-text" },
        { name: "6", digits: 4, count: 3, class: "black-text" },
        { name: "5", digits: 4, class: "black-text" },
        { name: "4", digits: 5, count: 7, class: "black-text" },
        { name: "3", digits: 5, count: 2, class: "black-text" },
        { name: "2", digits: 5, class: "black-text" },
        { name: "1", digits: 5, class: "black-text" },
        { name: "ĐB", digits: 6, class: "red-text" }
    ];

    let currentDaiList = [];

    // Lấy thông tin ngày và đài dựa trên mốc 16:30 chiều
    getTargetDateAndStations = function() {
        let now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();

        // Sau 16:30 (16h30) thì tự động tính sang ngày tiếp theo
        if (hours > 16 || (hours === 16 && minutes >= 30)) {
            now.setDate(now.getDate() + 1);
        }

        let dayOfWeek = now.getDay(); // 0 là Chủ Nhật, 1 là Thứ Hai...
        let daysText = ["CHỦ NHẬT", "THỨ HAI", "THỨ BA", "THỨ TƯ", "THỨ NĂM", "THỨ SÁU", "THỨ BẢY"];
        let dayName = daysText[dayOfWeek];

        let dateStr = String(now.getDate()).padStart(2, '0') + '/' + 
                      String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                      now.getFullYear();

        return {
            dayName: dayName,
            dateStr: dateStr,
            stations: schedule[dayOfWeek]
        };
    }

    function updateHeaderAndStations() {
        let info = getTargetDateAndStations();
        currentDaiList = info.stations;

        document.getElementById("header-title").innerText = `QUAY THỬ XSKT MIỀN NAM, ${info.dayName}, NGÀY ${info.dateStr}`;

        // Hiển thị số cột đài linh hoạt (3 hoặc 4 đài tùy theo ngày)
        let totalCols = currentDaiList.length;
        for (let i = 0; i < 4; i++) {
            let thElem = document.getElementById(`dai-${i}`);
            if (thElem) {
                if (i < totalCols) {
                    thElem.innerText = currentDaiList[i];
                    thElem.style.display = "";
                } else {
                    thElem.style.display = "none";
                }
            }
        }
    }

    function initTable() {
        let totalCols = currentDaiList.length;
        const tbody = document.getElementById("lottery-body");
        tbody.innerHTML = "";
        
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                let row = document.createElement("tr");
                let labelCell = document.createElement("td");
                labelCell.className = "prize-label";
                if (i === 0) labelCell.innerText = `Giải ${p.name}`;
                row.appendChild(labelCell);

                for (let col = 0; col < totalCols; col++) {
                    let td = document.createElement("td");
                    td.className = `number-cell ${p.class}`;
                    td.id = `p-${p.name}-${col}-${i}`;
                    td.innerText = "";
                    row.appendChild(td);
                }
                tbody.appendChild(row);
            }
        });
    }

    function getRandomNumber(digits) {
        let max = Math.pow(10, digits);
        let numStr = Math.floor(Math.random() * max).toString();
        return numStr.padStart(digits, '0');
    }

    let mediaRecorder;

    async function startQuayThu() {
        const btn = document.getElementById("start-btn");
        const statusText = document.getElementById("status-text");
        btn.disabled = true;
        initTable();

        let totalCols = currentDaiList.length;

        // Tạo danh sách các ô cần quay số
        let queue = [];
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                for (let col = 0; col < totalCols; col++) {
                    queue.push({ id: `p-${p.name}-${col}-${i}`, digits: p.digits });
                }
            }
        });

        // Tính toán tốc độ chạy để tổng thời gian quay đúng khoảng 90 giây (1 phút 30 giây)
        let totalCells = queue.length;
        let timePerCellMs = 90000 / totalCells; 

        // Kích hoạt ghi hình màn hình khu vực bảng kết quả
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { mediaSource: "screen" },
                audio: false 
            });
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            let chunks = [];
            
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                let blob = new Blob(chunks, { type: 'video/webm' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = `quay-thu-xskt-${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                statusText.innerText = "Quay xong và đã tự động tải video về máy!";
            };

            mediaRecorder.start();
            statusText.innerText = "Đang quay số và ghi hình video (Khoảng 1 phút 30 giây)...";
        } catch (err) {
            statusText.innerText = "Đang chạy quay số (Chế độ không quay video do bạn từ chối chia sẻ màn hình).";
        }

        let index = 0;

        function runStep() {
            if (index < queue.length) {
                let item = queue[index];
                let cell = document.getElementById(item.id);
                
                let counter = 0;
                let maxCounter = 10;
                let intervalTime = Math.max(10, (timePerCellMs - 200) / maxCounter);

                let interval = setInterval(() => {
                    cell.innerText = getRandomNumber(item.digits);
                    counter++;
                    if (counter > maxCounter) {
                        clearInterval(interval);
                        cell.innerText = getRandomNumber(item.digits);
                        index++;
                        setTimeout(runStep, 50);
                    }
                }, intervalTime);
            } else {
                // Hoàn thành tất cả các giải
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                    btn.disabled = false;
                }, 1500);
            }
        }

        runStep();
    }

    window.onload = function() {
        updateHeaderAndStations();
        initTable();
    };
</script>

</body>
</html>
