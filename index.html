<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quay Thử XSKT Miền Nam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 5px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 2px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        /* Header */
        .header {
            background-color: #ffcc00;
            color: #cc0000;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        /* Bảng kết quả */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px 2px;
            font-size: 13px;
        }
        th {
            background-color: #fff;
            color: #cc0000;
            font-size: 14px;
            text-transform: uppercase;
        }
        .prize-label {
            width: 55px;
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }
        .number-cell {
            font-weight: bold;
            letter-spacing: 0.5px;
            height: 28px;
        }
        .red-text {
            color: #cc0000;
            font-size: 18px;
            font-weight: bold;
        }
        .blue-text {
            color: #0000cc;
            font-size: 15px;
            font-weight: bold;
        }
        .black-text {
            color: #000;
            font-size: 14px;
        }
        /* Khu vực điều khiển */
        .controls {
            text-align: center;
            padding: 10px;
            background: #e9e9e9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .controls button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }
        .controls button:hover {
            background-color: #990000;
        }
        .controls button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status-text {
            font-size: 12px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    <!-- Tiêu đề cập nhật động -->
    <div class="header" id="header-title">
        QUAY THỬ XSKT MIỀN NAM, THỨ..., NGÀY .../.../......
    </div>

    <!-- Bảng kết quả xổ số (3 đài: Bến Tre, Vũng Tàu, Bạc Liêu) -->
    <table>
        <thead>
            <tr>
                <th style="width: 55px;"></th>
                <th>BẾN TRE</th>
                <th>VŨNG TÀU</th>
                <th>BẠC LIÊU</th>
            </tr>
        </thead>
        <tbody id="lottery-body">
            <!-- Dữ liệu các giải sẽ được sinh tự động bằng JavaScript -->
        </tbody>
    </table>

    <!-- Nút bấm điều khiển -->
    <div class="controls">
        <button id="start-btn" onclick="startQuayThu()">BẮT ĐẦU QUAY THỬ & QUAY VIDEO</button>
        <span id="status-text">Nhấn bắt đầu để quay số và tự động ghi hình lưu về máy.</span>
    </div>
</div>

<script>
    const prizes = [
        { name: "8", digits: 2, class: "red-text" },
        { name: "7", digits: 3, class: "blue-text" },
        { name: "6", digits: 4, count: 3, class: "black-text" },
        { name: "5", digits: 4, class: "black-text" },
        { name: "4", digits: 5, count: 7, class: "black-text" },
        { name: "3", digits: 5, count: 2, class: "black-text" },
        { name: "2", digits: 5, class: "black-text" },
        { name: "1", digits: 5, class: "black-text" },
        { name: "ĐB", digits: 6, class: "red-text" }
    ];

    function updateHeaderDate() {
        const days = ["CHỦ NHẬT", "THỨ HAI", "THỨ BA", "THỨ TƯ", "THỨ NĂM", "THỨ SÁU", "THỨ BẢY"];
        const now = new Date();
        const dayName = days[now.getDay()];
        const date = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();

        document.getElementById("header-title").innerText = `QUAY THỬ XSKT MIỀN NAM, ${dayName}, NGÀY ${date}/${month}/${year}`;
    }

    function initTable() {
        const tbody = document.getElementById("lottery-body");
        tbody.innerHTML = "";
        
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                let row = document.createElement("tr");
                let labelCell = document.createElement("td");
                labelCell.className = "prize-label";
                if (i === 0) labelCell.innerText = `Giải ${p.name}`;
                row.appendChild(labelCell);

                for (let col = 0; col < 3; col++) {
                    let td = document.createElement("td");
                    td.className = `number-cell ${p.class}`;
                    td.id = `p-${p.name}-${col}-${i}`;
                    td.innerText = "";
                    row.appendChild(td);
                }
                tbody.appendChild(row);
            }
        });
    }

    function getRandomNumber(digits) {
        let max = Math.pow(10, digits);
        let numStr = Math.floor(Math.random() * max).toString();
        return numStr.padStart(digits, '0');
    }

    let mediaRecorder;
    let recordedChunks = [];

    async function startQuayThu() {
        const btn = document.getElementById("start-btn");
        const statusText = document.getElementById("status-text");
        btn.disabled = true;
        initTable();

        // Bắt đầu quay video màn hình khu vực bảng
        try {
            const containerElem = document.getElementById("capture-area");
            // Sử dụng getDisplayMedia hoặc stream từ canvas/element nếu hỗ trợ
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { mediaSource: "screen" },
                audio: false 
            });
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `quay-thu-xskt-${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
                statusText.innerText = "Đã quay và tải video thành công!";
            };

            mediaRecorder.start();
            statusText.innerText = "Đang quay video và chạy kết quả...";
        } catch (err) {
            console.log("Không thể bật quay màn hình tự động hoặc bị hủy: ", err);
            statusText.innerText = "Chạy quay số (Không quay được video do trình duyệt từ chối quyền).";
        }

        // Tạo danh sách các ô cần quay số
        let queue = [];
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                for (let col = 0; col < 3; col++) {
                    queue.push({ id: `p-${p.name}-${col}-${i}`, digits: p.digits });
                }
            }
        });

        let index = 0;

        function runStep() {
            if (index < queue.length) {
                let item = queue[index];
                let cell = document.getElementById(item.id);
                
                let counter = 0;
                let interval = setInterval(() => {
                    cell.innerText = getRandomNumber(item.digits);
                    counter++;
                    if (counter > 6) {
                        clearInterval(interval);
                        cell.innerText = getRandomNumber(item.digits);
                        index++;
                        setTimeout(runStep, 80);
                    }
                }, 30);
            } else {
                // Kết thúc quay số, dừng quay video sau 1 giây
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                        // Dừng các track stream màn hình
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                    btn.disabled = false;
                }, 1000);
            }
        }

        runStep();
    }

    window.onload = function() {
        updateHeaderDate();
        initTable();
    };
</script>

</body>
</html>
