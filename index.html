<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quay Thử XSKT Miền Nam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border: 3px solid #ffcc00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        /* Header */
        .header {
            background-color: #ffcc00;
            color: #cc0000;
            text-align: center;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
        }
        /* Bảng kết quả */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            font-size: 16px;
        }
        th {
            background-color: #fff;
            color: #cc0000;
            font-size: 18px;
            text-transform: uppercase;
            width: 33.33%;
        }
        .prize-label {
            width: 80px;
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        .number-cell {
            font-weight: bold;
            letter-spacing: 1px;
            height: 35px;
        }
        .red-text {
            color: #cc0000;
            font-size: 24px;
            font-weight: bold;
        }
        .blue-text {
            color: #0000cc;
            font-size: 20px;
            font-weight: bold;
        }
        .black-text {
            color: #000;
            font-size: 18px;
        }
        /* Footer con số may mắn */
        .footer-banner {
            background-color: #00b050;
            color: #ffff00;
            text-align: center;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 3px solid #ffcc00;
        }
        /* Khu vực điều khiển */
        .controls {
            text-align: center;
            padding: 15px;
            background: #e9e9e9;
        }
        .controls button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .controls button:hover {
            background-color: #990000;
        }
        .controls button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tiêu đề cập nhật động -->
    <div class="header" id="header-title">
        QUAY THỬ XSKT MIỀN NAM, THỨ..., NGÀY .../.../......
    </div>

    <!-- Bảng kết quả xổ số (Ví dụ 3 đài: Bến Tre, Vũng Tàu, Bạc Liêu) -->
    <table>
        <thead>
            <tr>
                <th style="width: 80px;"></th>
                <th>BẾN TRE</th>
                <th>VŨNG TÀU</th>
                <th>BẠC LIÊU</th>
            </tr>
        </thead>
        <tbody id="lottery-body">
            <!-- Dữ liệu các giải sẽ được sinh tự động bằng JavaScript -->
        </tbody>
    </table>

    <!-- Banner cuối -->
    <div class="footer-banner">
        CON SỐ MAY MẮN
    </div>

    <!-- Nút bấm điều khiển -->
    <div class="controls">
        <button id="start-btn" onclick="startQuayThu()">BẮT ĐẦU QUAY THỬ</button>
    </div>
</div>

<script>
    // Cấu hình các giải và số lượng chữ số của từng giải miền Nam
    const prizes = [
        { name: "8", digits: 2, class: "red-text" },
        { name: "7", digits: 3, class: "blue-text" },
        { name: "6", digits: 4, count: 3, class: "black-text" },
        { name: "5", digits: 4, class: "black-text" },
        { name: "4", digits: 5, count: 7, class: "black-text" },
        { name: "3", digits: 5, count: 2, class: "black-text" },
        { name: "2", digits: 5, class: "black-text" },
        { name: "1", digits: 5, class: "black-text" },
        { name: "ĐB", digits: 6, class: "red-text" }
    ];

    // Tự động cập nhật thứ, ngày, tháng, năm hiện tại
    function updateHeaderDate() {
        const days = ["CHỦ NHẬT", "THỨ HAI", "THỨ BA", "THỨ TƯ", "THỨ NĂM", "THỨ SÁU", "THỨ BẢY"];
        const now = new Date();
        const dayName = days[now.getDay()];
        const date = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();

        document.getElementById("header-title").innerText = `QUAY THỬ XSKT MIỀN NAM, ${dayName}, NGÀY ${date}/${month}/${year}`;
    }

    // Khởi tạo bảng trống
    function initTable() {
        const tbody = document.getElementById("lottery-body");
        tbody.innerHTML = "";
        
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                let row = document.createElement("tr");
                let labelCell = document.createElement("td");
                labelCell.className = "prize-label";
                if (i === 0) labelCell.innerText = `Giải ${p.name}`;
                row.appendChild(labelCell);

                // 3 đài tương ứng 3 cột
                for (let col = 0; col < 3; col++) {
                    let td = document.createElement("td");
                    td.className = `number-cell ${p.class}`;
                    td.id = `p-${p.name}-${col}-${i}`;
                    td.innerText = "";
                    row.appendChild(td);
                }
                tbody.appendChild(row);
            }
        });
    }

    // Tạo số ngẫu nhiên có đủ số chữ số (thêm số 0 phía trước nếu thiếu)
    function getRandomNumber(digits) {
        let max = Math.pow(10, digits);
        let numStr = Math.floor(Math.random() * max).toString();
        return numStr.padStart(digits, '0');
    }

    // Hiệu ứng quay thử
    function startQuayThu() {
        const btn = document.getElementById("start-btn");
        btn.disabled = true;
        initTable();

        let queue = [];
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                for (let col = 0; col < 3; col++) {
                    queue.push({ id: `p-${p.name}-${col}-${i}`, digits: p.digits });
                }
            }
        });

        let index = 0;

        function runStep() {
            if (index < queue.length) {
                let item = queue[index];
                let cell = document.getElementById(item.id);
                
                // Hiệu ứng chạy số nhanh trong 400ms trước khi ra kết quả chính thức
                let counter = 0;
                let interval = setInterval(() => {
                    cell.innerText = getRandomNumber(item.digits);
                    counter++;
                    if (counter > 8) {
                        clearInterval(interval);
                        cell.innerText = getRandomNumber(item.digits); // Chốt số cuối cùng
                        index++;
                        setTimeout(runStep, 100); // Tốc độ quay giữa các ô
                    }
                }, 40);
            } else {
                btn.disabled = false;
            }
        }

        runStep();
    }

    // Chạy khi tải trang
    window.onload = function() {
        updateHeaderDate();
        initTable();
    };
</script>

</body>
</html>
