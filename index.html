<!DOCTYPE html>
<html lang="vi">
<head>

  <style>

    .station-select { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 3px 5px; font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; color: #0b4a92; outline: none; }
    .btn-group { display: flex; gap: 4px; flex-shrink: 0; }

    .btn-download { display: inline-flex; background: #2e7d32; color: #fff; border: none; border-radius: 4px; padding: 4px 7px; font-size: 11.5px; font-weight: 700; cursor: pointer; }

    .title-area h1 { color: #d32f2f; font-size: 14px; font-weight: 700; line-height: 1.2; text-transform: uppercase; }
    .title-area p { color: #666; font-size: 10px; line-height: 1.1; margin-top: 2px;}
    .table-wrapper { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; overflow-y: auto;}
    .table-header { display: flex; background: #f5f5f5; border-bottom: 1px solid #ccc; min-height: 25px; flex-shrink: 0; font-weight: 700; font-size: 13px; color: #111; }

    .col-station { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #e0e0e0; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 2px; }
    .col-station:last-child { border-right: none; }

    .prize-row { display: flex; border-bottom: 1px solid #e0e0e0; width: 100%; min-height: 30px; }
    .prize-row:last-child { border-bottom: none; }
    
    /* Flex chia tỷ lệ các giải Miền Nam / Trung */
    .row-g8 { flex: 1.1; } .row-g7 { flex: 1; } .row-g6 { flex: 2.8; } .row-g5 { flex: 1; } 
    .row-g4 { flex: 6.2; } .row-g3 { flex: 1.9; } .row-g2 { flex: 1; } .row-g1 { flex: 1; } .row-db { flex: 1.2; }
    
    .station-nums { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #e0e0e0; justify-content: space-evenly; padding: 2px 0;}

    .row-g8 .num-cell, .row-db .num-cell, .row-db .col-giai { color: #d32f2f; font-size: clamp(16px, 2.7vh, 20px); }
    .num-cell.active-spin { background: #fff176; color: #d9430f; border-radius: 2px;}

    .mb-grid-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }

<body>
  <!-- TRỤC TRÊN CÙNG -->
  <div class="app-bar">
    <div class="app-bar-left"><span>&#8592; Quay thử 3 Miền</span></div>
    <div class="app-bar-right">

      <input type="file" id="mp3Input" accept="audio/*" style="display:none" onchange="loadCustomMp3(event)">
    </div>
  </div>

  <!-- MENU 3 MIỀN -->
  <div class="region-tabs">
    <button id="tab-mn" class="region-tab active" onclick="selectRegionTab('mn')">MIỀN NAM</button>
    <button id="tab-mt" class="region-tab" onclick="selectRegionTab('mt')">MIỀN TRUNG</button>
    <button id="tab-mb" class="region-tab" onclick="selectRegionTab('mb')">MIỀN BẮC</button>
  </div>

  <!-- CONTROL CHỌN THỨ & NÚT QUAY -->
  <div class="control-bar">
    <select id="daySelect" class="station-select" onchange="changeDayFromDropdown()"></select>
    <div class="btn-group">
      <button id="spinBtn" class="btn-spin" onclick="toggleSpin()">QUAY THỬ</button>
      <button id="downloadBtn" class="btn-download" onclick="openModal()">⬇ VIDEO</button>
    </div>
  </div>

  <!-- TIÊU ĐỀ -->
  <div class="title-area">
    <h1 id="mainTitle">Tham khảo Xổ Số miền Nam</h1>
    <p id="subTitle">Thông tin mô phỏng chỉ mang tính tham khảo</p>
  </div>

  <!-- KHUNG BẢNG KẾT QUẢ XỔ SỐ -->
  <div class="table-wrapper" id="tableWrapper">
    <div class="table-header" id="tableHeader"></div>
    <div class="table-body" id="tableBody"></div>
  </div>

  <!-- CHÂN TRANG - CHẾ ĐỘ XEM SỐ -->
  <div class="footer-bar">
    <label class="radio-label"><input type="radio" name="viewMode" value="all" checked onchange="updateDisplayMode()"> Đầy đủ</label>
    <label class="radio-label"><input type="radio" name="viewMode" value="2" onchange="updateDisplayMode()"> 2 Số cuối</label>
    <label class="radio-label"><input type="radio" name="viewMode" value="3" onchange="updateDisplayMode()"> 3 Số cuối</label>
  </div>

  <!-- MODAL XUẤT VIDEO -->
  <div id="videoModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Đã xuất Video + Nhạc Xổ Số!</h3>
      <p id="modalDesc">Video chuẩn MP4 đã sẵn sàng đăng Facebook / TikTok:</p>
      <div class="modal-actions">
        <button class="btn-save-main" onclick="alert('Chức năng render MP4 đang phát triển!')">📤 CHIA SẺ LÊN ZALO / FB</button>
        <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <!-- KỊCH BẢN CHÍNH (JAVASCRIPT) -->
  <script>
    // -------------------------------------
    // CẤU HÌNH DỮ LIỆU CÁC MIỀN & GIẢI
    // -------------------------------------
    const prizeConfigMNMT = [
      { label: '8', class: 'row-g8', rows: 1, digits: 2 },
      { label: '7', class: 'row-g7', rows: 1, digits: 3 },
      { label: '6', class: 'row-g6', rows: 3, digits: 4 },
      { label: '5', class: 'row-g5', rows: 1, digits: 4 },
      { label: '4', class: 'row-g4', rows: 7, digits: 5 },
      { label: '3', class: 'row-g3', rows: 2, digits: 5 },
      { label: '2', class: 'row-g2', rows: 1, digits: 5 },
      { label: '1', class: 'row-g1', rows: 1, digits: 5 },
      { label: 'ĐB', class: 'row-db', rows: 1, digits: 6 }
    ];

    const prizeConfigMB = [
      { label: 'ĐB', class: 'mb-row-db', rows: 1, cols: 1, digits: 5 },
      { label: '1',  class: 'mb-row-g1', rows: 1, cols: 1, digits: 5 },
      { label: '2',  class: 'mb-row-g2', rows: 1, cols: 2, digits: 5 },
      { label: '3',  class: 'mb-row-g3', rows: 2, cols: 3, digits: 5 },
      { label: '4',  class: 'mb-row-g4', rows: 1, cols: 4, digits: 4 },
      { label: '5',  class: 'mb-row-g5', rows: 2, cols: 3, digits: 4 },
      { label: '6',  class: 'mb-row-g6', rows: 1, cols: 3, digits: 3 },
      { label: '7',  class: 'mb-row-g7', rows: 1, cols: 4, digits: 2 }
    ];

    const schedulesByRegion = {
      mn: {
        shortName: 'Miền Nam', title: 'Tham khảo Xổ Số Miền Nam',
        days: {
          0: { name: 'Chủ Nhật', stations: ['Tiền Giang', 'Kiên Giang', 'Đà Lạt'] },
          1: { name: 'Thứ 2', stations: ['TP.HCM', 'Đồng Tháp', 'Cà Mau'] },
          2: { name: 'Thứ 3', stations: ['Bến Tre', 'Vũng Tàu', 'Bạc Liêu'] },
          3: { name: 'Thứ 4', stations: ['Đồng Nai', 'Cần Thơ', 'Sóc Trăng'] },
          4: { name: 'Thứ 5', stations: ['Tây Ninh', 'An Giang', 'Bình Thuận'] },
          5: { name: 'Thứ 6', stations: ['Vĩnh Long', 'Bình Dương', 'Trà Vinh'] },
          6: { name: 'Thứ 7', stations: ['TP.HCM', 'Long An', 'Bình Phước', 'Hậu Giang'] }
        }
      },
      mt: {
        shortName: 'Miền Trung', title: 'Tham khảo Xổ Số Miền Trung',
        days: {
          0: { name: 'Chủ Nhật', stations: ['Khánh Hòa', 'Kon Tum', 'T.T.Huế'] },
          1: { name: 'Thứ 2', stations: ['Phú Yên', 'T.T.Huế'] },
          2: { name: 'Thứ 3', stations: ['Đắk Lắk', 'Quảng Nam'] },
          3: { name: 'Thứ 4', stations: ['Đà Nẵng', 'Khánh Hòa'] },
          4: { name: 'Thứ 5', stations: ['Bình Định', 'Quảng Trị', 'Quảng Bình'] },
          5: { name: 'Thứ 6', stations: ['Gia Lai', 'Ninh Thuận'] },
          6: { name: 'Thứ 7', stations: ['Đà Nẵng', 'Quảng Ngãi', 'Đắk Nông'] }
        }
      },
      mb: {
        shortName: 'Miền Bắc', title: 'Tham khảo Xổ Số Miền Bắc',
        days: {
          0: { name: 'Chủ Nhật', stations: ['Thái Bình'] },
          1: { name: 'Thứ 2', stations: ['Hà Nội'] },
          2: { name: 'Thứ 3', stations: ['Quảng Ninh'] },
          3: { name: 'Thứ 4', stations: ['Bắc Ninh'] },
          4: { name: 'Thứ 5', stations: ['Hà Nội'] },
          5: { name: 'Thứ 6', stations: ['Hải Phòng'] },
          6: { name: 'Thứ 7', stations: ['Nam Định'] }
        }
      }
    };

    let currentRegion = 'mn';
    let currentDayIdx = new Date().getDay();
    let currentStations = [];
    let isSpinning = false;
    let allSpinCells = [];
    let viewMode = 'all'; 

    // -------------------------------------
    // LOGIC ÂM THANH & BẢN NHẠC TRUYỀN THỐNG
    // -------------------------------------
    let audioCtx = null, masterGain = null, streamDest = null, isMuted = false;
    let melodyTimer = null, stepBeat = 0, customAudioBuffer = null, customAudioSource = null;

    const traditionalLotteryScore = [
      [523.25, 392.00, 130.81, 0.16], [659.25, 523.25, 0, 0.16], [783.99, 659.25, 196.00, 0.16], [1046.50, 783.99, 130.81, 0.30],
      [0, 0, 0, 0.12], [783.99, 659.25, 196.00, 0.16], [1046.50, 783.99, 130.81, 0.34], [0, 0, 0, 0.14],
      [880.00, 698.46, 174.61, 0.16], [1046.50, 880.00, 0, 0.16], [880.00, 698.46, 174.61, 0.16], [783.99, 659.25, 130.81, 0.30],
      [659.25, 523.25, 196.00, 0.16], [783.99, 659.25, 0, 0.16], [659.25, 523.25, 196.00, 0.16], [523.25, 392.00, 130.81, 0.34],
      [587.33, 440.00, 146.83, 0.16], [698.46, 587.33, 0, 0.16], [880.00, 698.46, 146.83, 0.16], [1174.66, 880.00, 196.00, 0.30],
      [0, 0, 0, 0.12], [987.77, 783.99, 196.00, 0.16], [783.99, 587.33, 0, 0.16], [1174.66, 987.77, 196.00, 0.32],
      [1046.50, 783.99, 130.81, 0.18], [783.99, 659.25, 196.00, 0.16], [659.25, 523.25, 130.81, 0.16], [783.99, 587.33, 196.00, 0.18],
      [1046.50, 783.99, 130.81, 0.42], [0, 0, 196.00, 0.15], [1046.50, 659.25, 130.81, 0.42], [0, 0, 0, 0.15]
    ];

    function ensureAudioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) {
        audioCtx = new AC({ sampleRate: 44100 });
        masterGain = audioCtx.createGain();
        masterGain.gain.value = isMuted ? 0 : 0.9;
        streamDest = audioCtx.createMediaStreamDestination();
        masterGain.connect(audioCtx.destination);
        masterGain.connect(streamDest);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBrassNote(freq, duration, vol = 0.14) {
      if (!audioCtx || freq <= 0) return;
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();
      osc1.type = 'sawtooth'; osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(freq, now); osc2.frequency.setValueAtTime(freq * 1.003, now);
      filter.type = 'lowpass'; filter.frequency.setValueAtTime(freq * 2.8, now); filter.Q.value = 2.5;
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(vol, now + 0.025); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterGain);
      osc1.start(now); osc2.start(now); osc1.stop(now + duration + 0.02); osc2.stop(now + duration + 0.02);
    }

    function playBassDrum(freq) {
      if (!audioCtx || freq <= 0) return;
      const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq * 1.5, now); osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.14);
      gain.gain.setValueAtTime(0.22, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain); gain.connect(masterGain); osc.start(now); osc.stop(now + 0.17);
    }

    function playLockSound(isSpecial = false) {
      if (isMuted || !audioCtx) return;
      if (isSpecial) {
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, idx) => {
          setTimeout(() => { playBrassNote(f, 0.75, 0.22); playBrassNote(f * 0.5, 0.75, 0.15); }, idx * 85);
        });
      } else { playBrassNote(1046.50, 0.22, 0.16); }
    }

    function startBackgroundMusic() {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      stopBackgroundMusic();
      
      // Nếu đã có MP3 tuỳ chỉnh tải lên/lưu trong Database
      if (customAudioBuffer) {
        customAudioSource = ctx.createBufferSource();
        customAudioSource.buffer = customAudioBuffer; customAudioSource.loop = true;
        const bgGain = ctx.createGain(); bgGain.gain.value = 0.8;
        customAudioSource.connect(bgGain); bgGain.connect(masterGain); customAudioSource.start(0);
        return;
      }
      
      // Nếu không có, đánh nhạc cụ điện tử truyền thống
      stepBeat = 0;
      melodyTimer = setInterval(() => {
        if (isMuted || !audioCtx || !isSpinning) return;
        const [lF, hF, bF, dur] = traditionalLotteryScore[stepBeat % traditionalLotteryScore.length];
        stepBeat++;
        if (lF > 0) playBrassNote(lF, dur, 0.15);
        if (hF > 0) playBrassNote(hF, dur, 0.09);
        if (bF > 0) playBassDrum(bF);
      }, 185);
    }

    function stopBackgroundMusic() {
      if (melodyTimer) { clearInterval(melodyTimer); melodyTimer = null; }
      if (customAudioSource) { try { customAudioSource.stop(); } catch (e) {} customAudioSource = null; }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteBtn').textContent = isMuted ? '🔇 Tắt tiếng' : '🔊 Bật tiếng';
      if (masterGain && audioCtx) masterGain.gain.setValueAtTime(isMuted ? 0 : 0.9, audioCtx.currentTime);
    }

    // -------------------------------------
    // INDEXED-DB: LƯU TRỮ MP3 VĨNH VIỄN
    // -------------------------------------
    const DB_NAME = 'LotteryAudioDB';
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveCustomAudio(file) {
      const db = await openDB();
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').put(file, 'myMusic');
    }

    async function getCustomAudio() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('audio', 'readonly');
        const req = tx.objectStore('audio').get('myMusic');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    function loadCustomMp3(event) {
      const file = event.target.files[0];
      if (!file) return;
      saveCustomAudio(file);
      processAudioFile(file);
    }

    function processAudioFile(file) {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        ctx.decodeAudioData(e.target.result, function(buffer) {
          customAudioBuffer = buffer;
          const btn = document.getElementById('mp3Btn');
          btn.textContent = '🎵 Đã lưu nhạc MP3';
          btn.style.background = '#2e7d32'; 
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // -------------------------------------
    // GIAO DIỆN & RENDER BẢNG KẾT QUẢ
    // -------------------------------------
    function selectRegionTab(region) {
      if(isSpinning) return;
      currentRegion = region;
      
      // Update Tabs
      document.querySelectorAll('.region-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + region).classList.add('active');
      
      const rData = schedulesByRegion[region];
      document.getElementById('mainTitle').innerText = rData.title;
      
      // Update Dropdown
      const sel = document.getElementById('daySelect');
      sel.innerHTML = '';
      const today = new Date().getDay();
      
      Object.keys(rData.days).forEach(idx => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.text = `${rData.days[idx].name} - ${rData.days[idx].stations.join(', ')}`;
        if (idx == today) opt.selected = true;
        sel.appendChild(opt);
      });
      
      currentDayIdx = today;
      currentStations = rData.days[currentDayIdx].stations;
      renderTable();
    }

    function changeDayFromDropdown() {
      if(isSpinning) return;
      currentDayIdx = document.getElementById('daySelect').value;
      currentStations = schedulesByRegion[currentRegion].days[currentDayIdx].stations;
      renderTable();
    }

    function formatNumberDisplay(numStr) {
      if(viewMode === 'all') return numStr;
      if(viewMode === '2') return numStr.slice(-2).padStart(2, '*');
      if(viewMode === '3') return numStr.slice(-3).padStart(3, '*');
      return numStr;
    }

    function updateDisplayMode() {
      viewMode = document.querySelector('input[name="viewMode"]:checked').value;
      if(!isSpinning) {
        // Cập nhật lại số đang hiển thị nếu không quay
        allSpinCells.forEach(c => {
          c.el.innerText = formatNumberDisplay(c.fullNum);
        });
      }
    }

    function renderTable() {
      const header = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');
      header.innerHTML = '';
      body.innerHTML = '';
      allSpinCells = [];
      
      if (currentRegion === 'mn' || currentRegion === 'mt') {
        // TẠO HEADER MN/MT
        header.innerHTML = `<div class="col-giai">Giải</div>`;
        currentStations.forEach(st => {
          header.innerHTML += `<div class="col-station">${st}</div>`;
        });
        
        // TẠO ROWS MN/MT
        prizeConfigMNMT.forEach((prize, rIdx) => {
          let rowHtml = `<div class="prize-row ${prize.class}"><div class="col-giai">${prize.label}</div>`;
          currentStations.forEach((st, cIdx) => {
            rowHtml += `<div class="station-nums">`;
            for(let r = 0; r < prize.rows; r++) {
                rowHtml += `<div class="num-line">`;
                const cellId = `cell-${cIdx}-${rIdx}-${r}`;
                const initialNum = '-'.repeat(prize.digits);
                rowHtml += `<div class="num-cell" id="${cellId}">${initialNum}</div>`;
                rowHtml += `</div>`;
            }
            rowHtml += `</div>`;
          });
          rowHtml += `</div>`;
          body.innerHTML += rowHtml;
        });

        // Gắn đối tượng logic
        prizeConfigMNMT.forEach((prize, rIdx) => {
          currentStations.forEach((_, cIdx) => {
            for(let r=0; r<prize.rows; r++) {
               allSpinCells.push({
                 el: document.getElementById(`cell-${cIdx}-${rIdx}-${r}`),
                 digits: prize.digits,
                 fullNum: '-'.repeat(prize.digits)
               });
            }
          });
        });

      } else {
        // TẠO HEADER MIỀN BẮC
        header.innerHTML = `<div class="col-giai">Giải</div><div class="col-station">${currentStations[0]}</div>`;
        
        // TẠO ROWS MIỀN BẮC
        prizeConfigMB.forEach((prize, rIdx) => {
          let rowHtml = `<div class="prize-row ${prize.class}"><div class="col-giai">${prize.label}</div><div class="mb-grid-container">`;
          
          for(let r=0; r<prize.rows; r++) {
            rowHtml += `<div class="mb-sub-row">`;
            for(let c=0; c<prize.cols; c++) {
              const cellId = `mb-cell-${rIdx}-${r}-${c}`;
              const initialNum = '-'.repeat(prize.digits);
              rowHtml += `<div class="num-cell" id="${cellId}">${initialNum}</div>`;
            }
            rowHtml += `</div>`;
          }
          rowHtml += `</div></div>`;
          body.innerHTML += rowHtml;
        });

        // Gắn đối tượng logic
        prizeConfigMB.forEach((prize, rIdx) => {
          for(let r=0; r<prize.rows; r++) {
            for(let c=0; c<prize.cols; c++) {
               allSpinCells.push({
                 el: document.getElementById(`mb-cell-${rIdx}-${r}-${c}`),
                 digits: prize.digits,
                 fullNum: '-'.repeat(prize.digits)
               });
            }
          }
        });
      }
    }

    function randNumStr(len) {
      let s = '';
      for(let i=0; i<len; i++) s += Math.floor(Math.random()*10);
      return s;
    }

    function toggleSpin() {
      if (isSpinning) return;
      isSpinning = true;
      const btn = document.getElementById('spinBtn');
      btn.classList.add('spinning');
      btn.innerText = 'ĐANG QUAY...';
      
      startBackgroundMusic();
      
      allSpinCells.forEach((c, idx) => {
        c.el.classList.add('active-spin');
        
        // Hiệu ứng số nhảy liên tục
        const timer = setInterval(() => {
          c.el.innerText = formatNumberDisplay(randNumStr(c.digits));
        }, 50);

        // Dừng dần từng ô
        setTimeout(() => {
          clearInterval(timer);
          const finalNum = randNumStr(c.digits);
          c.fullNum = finalNum;
          c.el.innerText = formatNumberDisplay(finalNum);
          c.el.classList.remove('active-spin');
          
          playLockSound();
          
          // Khi ô cuối cùng hoàn tất
          if (idx === allSpinCells.length - 1) {
            isSpinning = false;
            btn.classList.remove('spinning');
            btn.innerText = 'QUAY THỬ';
            stopBackgroundMusic();
            playLockSound(true); // Nhạc chuông chốt hạ ĐB
          }
        }, 600 + idx * 160);
      });
    }

    // Modal Action
    function openModal() { document.getElementById('videoModal').classList.add('show'); }
    function closeModal() { document.getElementById('videoModal').classList.remove('show'); }

    // KHỞI TẠO TỰ ĐỘNG
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Dựng UI mặc định
      selectRegionTab('mn');
      
      // 2. Khôi phục nhạc MP3 nếu đã từng lưu trong Database
      const savedAudio = await getCustomAudio();
      if (savedAudio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AC({ sampleRate: 44100 });
        
        const reader = new FileReader();
        reader.onload = function(e) {
          audioCtx.decodeAudioData(e.target.result, function(buffer) {
            customAudioBuffer = buffer;
            const btn = document.getElementById('mp3Btn');
            btn.textContent = '🎵 Nhạc đã tải sẵn';
            btn.style.background = '#2e7d32'; 
          });
        };
        reader.readAsArrayBuffer(savedAudio);
      }
    });

  </script>
</body>
</html>
