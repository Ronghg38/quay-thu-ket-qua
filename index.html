<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quay Thử XSKT Miền Nam</title>
    <!-- Thư viện hỗ trợ ghi hình video trực tiếp từ trình duyệt -->
    <script src="https://www.jsdelivr.com/package/npm/recordrtc"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 5px;
        }
        /* Bảng tùy chỉnh ngày và đài */
        .config-panel {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 2px solid #ccc;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 13px;
        }
        .config-panel label {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            color: #333;
        }
        .config-panel input, .config-panel select {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .station-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .station-checkboxes label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 2px solid #ffcc00;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header {
            background-color: #ffcc00;
            color: #cc0000;
            text-align: center;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px 2px;
            font-size: 13px;
        }
        th {
            background-color: #fff;
            color: #cc0000;
            font-size: 13px;
            text-transform: uppercase;
        }
        .prize-label {
            width: 55px;
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }
        .number-cell {
            font-weight: bold;
            letter-spacing: 0.5px;
            height: 28px;
        }
        .red-text {
            color: #cc0000;
            font-size: 17px;
            font-weight: bold;
        }
        .blue-text {
            color: #0000cc;
            font-size: 14px;
            font-weight: bold;
        }
        .black-text {
            color: #000;
            font-size: 13px;
        }
        .controls {
            text-align: center;
            padding: 10px;
            background: #e9e9e9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .controls button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }
        .controls button:hover {
            background-color: #990000;
        }
        .controls button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status-text {
            font-size: 12px;
            color: #555;
            font-style: italic;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Bảng tùy chỉnh ngày tháng và chọn đài -->
    <div class="config-panel">
        <label for="input-date">Chọn Ngày Quay Thử:</label>
        <input type="date" id="input-date" onchange="onDateOrStationChange()">

        <label>Chọn Đài Miền Nam (Tối đa 4 đài):</label>
        <div class="station-checkboxes" id="station-list-container">
            <!-- Được tạo tự động bằng JS -->
        </div>
    </div>

<div class="container" id="capture-area">
    <div class="header" id="header-title">
        QUAY THỬ XSKT MIỀN NAM
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 55px;" id="col-label"></th>
                <th id="dai-0">ĐÀI 1</th>
                <th id="dai-1">ĐÀI 2</th>
                <th id="dai-2" style="display:none;">ĐÀI 3</th>
                <th id="dai-3" style="display:none;">ĐÀI 4</th>
            </tr>
        </thead>
        <tbody id="lottery-body">
        </tbody>
    </table>

    <div class="controls">
        <button id="start-btn" onclick="startQuayThu()">BẮT ĐẦU QUAY THỬ (1 PHÚT 30 GIÂY)</button>
        <span id="status-text">Hệ thống sẵn sàng. Nhấn nút để bắt đầu quay số chậm rãi.</span>
    </div>
</div>

<script>
    // Danh sách toàn bộ các đài miền Nam trong tuần
    const allStations = [
        "TP. HỒ CHÍ MINH", "ĐỒNG THÁP", "CÀ MAU", 
        "BẾN TRE", "VŨNG TÀU", "BẠC LIÊU", 
        "ĐỒNG NAI", "CẦN THƠ", "SÓC TRĂNG", 
        "TÂY NINH", "AN GIANG", "BÌNH THUẬN", 
        "VĨNH LONG", "BÌNH DƯƠNG", "TRÀ VINH", 
        "LONG AN", "BÌNH PHƯỚC", "HẬU GIANG", 
        "ĐÀ LAT", "KIÊN GIANG", "TIỀN GIANG"
    ];

    // Lịch mặc định theo thứ trong tuần (0: Chủ Nhật -> 6: Thứ Bảy)
    const defaultSchedule = {
        0: ["TIỀN GIANG", "KIÊN GIANG", "ĐÀ LAT"],
        1: ["TP. HỒ CHÍ MINH", "ĐỒNG THÁP", "CÀ MAU"],
        2: ["BẾN TRE", "VŨNG TÀU", "BẠC LIÊU"],
        3: ["ĐỒNG NAI", "CẦN THƠ", "SÓC TRĂNG"],
        4: ["TÂY NINH", "AN GIANG", "BÌNH THUẬN"],
        5: ["VĨNH LONG", "BÌNH DƯƠNG", "TRÀ VINH"],
        6: ["TP. HỒ CHÍ MINH", "LONG AN", "BÌNH PHƯỚC", "HẬU GIANG"]
    };

    const prizes = [
        { name: "8", digits: 2, class: "red-text" },
        { name: "7", digits: 3, class: "blue-text" },
        { name: "6", digits: 4, count: 3, class: "black-text" },
        { name: "5", digits: 4, class: "black-text" },
        { name: "4", digits: 5, count: 7, class: "black-text" },
        { name: "3", digits: 5, count: 2, class: "black-text" },
        { name: "2", digits: 5, class: "black-text" },
        { name: "1", digits: 5, class: "black-text" },
        { name: "ĐB", digits: 6, class: "red-text" }
    ];

    let currentDaiList = [];

    // Khởi tạo ngày mặc định (tính theo mốc 16:30 chiều)
    function initDefaultDate() {
        let now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();

        // Sau 16:30 tự động nhảy sang ngày hôm sau
        if (hours > 16 || (hours === 16 && minutes >= 30)) {
            now.setDate(now.getDate() + 1);
        }

        let yyyy = now.getFullYear();
        let mm = String(now.getMonth() + 1).padStart(2, '0');
        let dd = String(now.getDate()).padStart(2, '0');
        
        document.getElementById("input-date").value = `${yyyy}-${mm}-${dd}`;
        setupStationCheckboxes();
        onDateOrStationChange();
    }

    // Tạo các checkbox chọn đài
    function setupStationCheckboxes() {
        let container = document.getElementById("station-list-container");
        container.innerHTML = "";
        
        let dateVal = new Date(document.getElementById("input-date").value);
        let dayOfWeek = dateVal.getDay();
        let suggestedStations = defaultSchedule[dayOfWeek] || defaultSchedule[1];

        allStations.forEach(station => {
            let lbl = document.createElement("label");
            let chk = document.createElement("input");
            chk.type = "checkbox";
            chk.value = station;
            chk.checked = suggestedStations.includes(station);
            chk.onchange = onDateOrStationChange;

            lbl.appendChild(chk);
            lbl.appendChild(document.createTextNode(" " + station));
            container.appendChild(lbl);
        });
    }

    // Khi thay đổi ngày, tự động gợi ý lịch đài tương ứng
    document.getElementById("input-date").addEventListener("change", function() {
        let dateVal = new Date(this.value);
        let dayOfWeek = dateVal.getDay();
        let suggestedStations = defaultSchedule[dayOfWeek] || defaultSchedule[1];

        let checkboxes = document.querySelectorAll("#station-list-container input[type='checkbox']");
        checkboxes.forEach(chk => {
            chk.checked = suggestedStations.includes(chk.value);
        });
        onDateOrStationChange();
    });

    function onDateOrStationChange() {
        let checkboxes = document.querySelectorAll("#station-list-container input[type='checkbox']:checked");
        currentDaiList = Array.from(checkboxes).map(chk => chk.value);

        if (currentDaiList.length === 0) {
            currentDaiList = ["BẾN TRE", "VŨNG TÀU", "BẠC LIÊU"]; // Mặc định nếu bỏ trống
        }

        // Cập nhật tiêu đề ngày tháng
        let dateInputVal = document.getElementById("input-date").value;
        if (dateInputVal) {
            let parts = dateInputVal.split("-");
            let dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            let daysText = ["CHỦ NHẬT", "THỨ HAI", "THỨ BA", "THỨ TƯ", "THỨ NĂM", "THỨ SÁU", "THỨ BẢY"];
            let dayName = daysText[dateObj.getDay()];
            let dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;

            document.getElementById("header-title").innerText = `QUAY THỬ XSKT MIỀN NAM, ${dayName}, NGÀY ${dateStr}`;
        }

        // Hiển thị các cột đài trên bảng
        for (let i = 0; i < 4; i++) {
            let thElem = document.getElementById(`dai-${i}`);
            if (thElem) {
                if (i < currentDaiList.length) {
                    thElem.innerText = currentDaiList[i];
                    thElem.style.display = "";
                } else {
                    thElem.style.display = "none";
                }
            }
        }
        initTable();
    }

    function initTable() {
        let totalCols = currentDaiList.length;
        const tbody = document.getElementById("lottery-body");
        tbody.innerHTML = "";
        
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                let row = document.createElement("tr");
                let labelCell = document.createElement("td");
                labelCell.className = "prize-label";
                if (i === 0) labelCell.innerText = `Giải ${p.name}`;
                row.appendChild(labelCell);

                for (let col = 0; col < totalCols; col++) {
                    let td = document.createElement("td");
                    td.className = `number-cell ${p.class}`;
                    td.id = `p-${p.name}-${col}-${i}`;
                    td.innerText = "";
                    row.appendChild(td);
                }
                tbody.appendChild(row);
            }
        });
    }

    function getRandomNumber(digits) {
        let max = Math.pow(10, digits);
        let numStr = Math.floor(Math.random() * max).toString();
        return numStr.padStart(digits, '0');
    }

    let mediaRecorder;

    async function startQuayThu() {
        const btn = document.getElementById("start-btn");
        const statusText = document.getElementById("status-text");
        btn.disabled = true;
        initTable();

        let totalCols = currentDaiList.length;
        let queue = [];
        prizes.forEach(p => {
            let count = p.count || 1;
            for (let i = 0; i < count; i++) {
                for (let col = 0; col < totalCols; col++) {
                    queue.push({ id: `p-${p.name}-${col}-${i}`, digits: p.digits });
                }
            }
        });

        // ĐẶT THỜI GIAN CHUẨN: Tổng thời gian quay đúng 90 giây (1 phút 30 giây)
        let totalCells = queue.length;
        let timePerCellMs = 90000 / totalCells; 

        // Thử kích hoạt ghi hình tự động (nếu trình duyệt máy tính hỗ trợ)
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { mediaSource: "screen" },
                audio: false 
            });
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            let chunks = [];
            
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                let blob = new Blob(chunks, { type: 'video/webm' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = `quay-thu-xskt-${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                statusText.innerText = "Quay xong và đã tự động tải video về máy thành công!";
            };

            mediaRecorder.start();
            statusText.innerText = "Đang chạy quay số chậm (1 phút 30 giây) và ghi hình video...";
        } catch (err) {
            // Trên điện thoại nếu bị trình duyệt chặn, hướng dẫn người dùng bật quay màn hình hệ thống
            statusText.innerHTML = "<b>Đang chạy quay số (1 phút 30 giây)...</b><br><i>(Mẹo trên điện thoại: Bạn hãy bật tính năng Quay màn hình có sẵn trên thanh công cụ điện thoại trước khi bấm để lưu video).</i>";
        }

        let index = 0;

        function runStep() {
            if (index < queue.length) {
                let item = queue[index];
                let cell = document.getElementById(item.id);
                
                let counter = 0;
                let maxCounter = 12; // Số lần đổi số để hiệu ứng mượt và chậm rãi
                let intervalTime = Math.max(20, (timePerCellMs - 150) / maxCounter);

                let interval = setInterval(() => {
                    cell.innerText = getRandomNumber(item.digits);
                    counter++;
                    if (counter > maxCounter) {
                        clearInterval(interval);
                        cell.innerText = getRandomNumber(item.digits);
                        index++;
                        setTimeout(runStep, 40);
                    }
                }, intervalTime);
            } else {
                // Hoàn thành tất cả các giải
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                    if(!mediaRecorder) {
                        statusText.innerHTML = "<b>Quay số hoàn tất!</b> (Hãy kiểm tra lại video từ tính năng quay màn hình của điện thoại).";
                    }
                    btn.disabled = false;
                }, 1500);
            }
        }

        runStep();
    }

    window.onload = function() {
        initDefaultDate();
    };
</script>

</body>
</html>
